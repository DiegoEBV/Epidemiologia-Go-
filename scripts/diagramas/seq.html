<text x="135" y="84">POST /api/entrenamientos {nodos:4, epocas:6}  (JWT admin)</text>
<text x="440" y="114">entrenamientos.insert(estado=en_cola)</text>
<text x="140" y="144">202 Accepted · Location: /api/entrenamientos/{id}</text>
<rect x="250" y="168" width="830" height="78" fill="#f3eefa" opacity=".5"/><text x="258" y="185" font-weight="bold" fill="#7d5ba6">1. Distribución (una goroutine por nodo, en paralelo)</text>
<text x="440" y="206">SHARD {worker, lote_local, normalización, columnas ≈ 4.8 MB}</text><text x="440" y="232">SHARD_OK {registros: 960 794, carga_ms}</text>
<rect x="250" y="250" width="830" height="190" fill="#fff8e6" opacity=".6"/><text x="258" y="268" font-weight="bold" fill="#b8860b">2. Por cada paso (234 por época × 6 épocas) — barrera síncrona</text>
<text x="440" y="296">PESOS {época, paso, w[32], b}  → a los 4 nodos a la vez</text><text x="440" y="326">GRADIENTE {∇w, ∇b, pérdida, peso_total}  (4 respuestas)</text>
<text x="260" y="360">reducción en orden de worker:</text><text x="260" y="378">w ← w − η(Σ∇w/Σω + λw)</text>
<text x="440" y="394">al final de cada época: entrenamientos.update(historial) + PUBLISH eventos → WebSocket</text>
<rect x="250" y="430" width="830" height="100" fill="#fbeeee" opacity=".6"/><text x="258" y="444" font-weight="bold" fill="#c0392b">3. Impacto distribuido (map-reduce)</text>

<text x="440" y="497">IMPACTO_OK {Σ letalidad, positivos, ≥60 por provincia}</text>
<text x="440" y="516">modelos.insert(v, activo) · impacto_provincias.insertMany · SET modelo:activo · DEL pred:*</text>
